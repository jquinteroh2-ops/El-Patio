# Configuración del backend.
#
# Nada de lo que cambia entre entornos está escrito aquí: todo entra por
# variables de entorno. Los valores por defecto que se ven abajo son los de la
# máquina de desarrollo, y ninguno es un secreto real.

spring:
  application:
    name: el-patio-backend

  # `produccion` cambia los registros a JSON. Railway lo define en el servicio.
  profiles:
    active: ${ELPATIO_PERFIL:desarrollo}

  datasource:
    # Railway entrega DATABASE_URL; en local se apunta al Postgres del docker compose.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/elpatio}
    username: ${DATABASE_USUARIO:elpatio}
    password: ${DATABASE_CLAVE:elpatio}
    hikari:
      maximum-pool-size: ${BD_POOL_MAX:10}
      connection-timeout: 10000

  jpa:
    hibernate:
      # El esquema lo manda Flyway. Que Hibernate lo toque sería tener dos
      # fuentes de verdad y descubrir la diferencia en producción.
      ddl-auto: validate
    open-in-view: false
    # Sin `jdbc.time_zone`: los instantes se guardan en TIMESTAMPTZ, que ya es
    # absoluto y no necesita ayuda. Forzar la zona hacía que Hibernate
    # reinterpretara también las columnas TIME, y el horario de domicilios
    # guardado como 11:30 se leía como 06:30.

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  # Railway y cualquier proxy ponen el HTTPS por delante: sin esto la aplicación
  # se cree en http y arma mal las URLs absolutas.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

elpatio:
  # El día operativo y el turno se calculan en esta zona, nunca en UTC.
  zona-horaria: ${ELPATIO_ZONA:America/Bogota}

  # Dónde queda el local, para medir qué tan lejos pidió el cliente.
  #
  # Los valores por defecto son el centro de Turbaco, NO la puerta del
  # restaurante: sirven para que la cuenta no falle, no para navegar. Ponga las
  # coordenadas reales antes de salir a producción; se sacan abriendo Google
  # Maps sobre el local y copiando el par que aparece en la URL.
  local:
    latitud: ${ELPATIO_LATITUD:10.3403}
    longitud: ${ELPATIO_LONGITUD:-75.4136}

  jwt:
    # Sin valor por defecto a propósito: si falta, el backend no arranca. Un
    # secreto de ejemplo funcionando en producción es peor que un fallo visible.
    secreto: ${ELPATIO_JWT_SECRETO}
    minutos-acceso: ${ELPATIO_JWT_MINUTOS:20}
    dias-refresco: ${ELPATIO_JWT_DIAS_REFRESCO:30}
  cors:
    # Lista separada por comas. Nunca `*`: el navegador envía el token.
    origenes: ${ELPATIO_CORS_ORIGENES:http://localhost:5173}

  # Cuentas de demostración con clave conocida, para enseñar el sistema.
  #
  # Vacío es lo correcto en producción: sin esto el modo no existe. Con esto
  # puesto, las seis cuentas quedan con esta misma clave en cada arranque y la
  # pantalla de acceso las muestra escritas. Ver ModoDemostracion.java.
  demostracion:
    clave: ${ELPATIO_CLAVE_DEMO:}

logging:
  level:
    root: ${LOG_NIVEL:INFO}
    co.elpatio: ${LOG_NIVEL_APP:INFO}
