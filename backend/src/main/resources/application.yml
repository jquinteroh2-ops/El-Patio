# Configuración del backend.
#
# Nada de lo que cambia entre entornos está escrito aquí: todo entra por
# variables de entorno. Los valores por defecto que se ven abajo son los de la
# máquina de desarrollo, y ninguno es un secreto real.

spring:
  application:
    name: el-patio-backend

  # `produccion` cambia los registros a JSON. Railway lo define en el servicio.
  profiles:
    active: ${ELPATIO_PERFIL:desarrollo}

  datasource:
    # Railway entrega DATABASE_URL; en local se apunta al Postgres del docker compose.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/elpatio}
    username: ${DATABASE_USUARIO:elpatio}
    password: ${DATABASE_CLAVE:elpatio}
    hikari:
      maximum-pool-size: ${BD_POOL_MAX:10}
      connection-timeout: 10000

  jpa:
    hibernate:
      # El esquema lo manda Flyway. Que Hibernate lo toque sería tener dos
      # fuentes de verdad y descubrir la diferencia en producción.
      ddl-auto: validate
    open-in-view: false
    # Sin `jdbc.time_zone`: los instantes se guardan en TIMESTAMPTZ, que ya es
    # absoluto y no necesita ayuda. Forzar la zona hacía que Hibernate
    # reinterpretara también las columnas TIME, y el horario de domicilios
    # guardado como 11:30 se leía como 06:30.

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      # Lo que se acepta que entre por la red. El almacen vuelve a revisar el
      # peso y ademas reduce la imagen; esto solo evita que un archivo enorme
      # ocupe memoria antes de que nadie lo mire.
      max-file-size: 12MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  # Railway y cualquier proxy ponen el HTTPS por delante: sin esto la aplicación
  # se cree en http y arma mal las URLs absolutas.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

elpatio:
  # El día operativo y el turno se calculan en esta zona, nunca en UTC.
  zona-horaria: ${ELPATIO_ZONA:America/Bogota}

  reclutamiento:
    # A quién se le avisa cuando llega una hoja de vida nueva.
    #
    # Vacío = no se avisa. Y hoy da igual lo que se ponga: el proyecto no tiene
    # proveedor de correo, así que el aviso solo queda escrito en la bitácora.
    # La variable existe ya para que el día que haya proveedor no haya que
    # tocar código.
    correo-administrador: ${ELPATIO_CORREO_ADMIN:}

    # Días durante los cuales no se acepta otra hoja de vida del mismo
    # documento. No es sospecha de fraude: la gente vuelve a pulsar el botón
    # cuando la página tarda. Quien se postuló hace tres meses y no tuvo
    # respuesta sí tiene derecho a volver a intentarlo.
    dias-sin-repetir: ${ELPATIO_DIAS_SIN_REPETIR:30}

  documentos:
    # Hojas de vida y adjuntos de PQR.
    #
    # EN RAILWAY TIENE QUE APUNTAR A UN VOLUMEN, por lo mismo que las imágenes:
    # el sistema de archivos del contenedor se borra en cada despliegue, y ahí
    # se irían las hojas de vida de quienes se postularon esta semana.
    #
    # Ojo el día del respaldo: `respaldar.sh` vuelca la base, y estos archivos
    # no están en la base. Un respaldo completo tiene que llevarse la carpeta.
    ruta: ${ELPATIO_RUTA_DOCUMENTOS:./datos/documentos}

  erp:
    # Por dónde sale la venta hacia el ERP que la factura (hoy Globalsoft).
    #
    #   manual  — no transmite. Deja la venta marcada para que alguien la digite
    #             en Globalsoft, y la pantalla de conciliación muestra cuáles
    #             faltan. Es el valor por defecto y el único que se puede usar
    #             hoy con seguridad, porque nadie ha visto la documentación de
    #             integración de Globalsoft.
    #   archivo — deposita un plano por venta en una carpeta para que Globalsoft
    #             lo importe. Es el camino más probable con un ERP instalado en
    #             la máquina del restaurante: un archivo cruza esa frontera, una
    #             conexión HTTP desde la nube no.
    #   rest    — manda la venta por HTTP. INCOMPLETO: falta el contrato real.
    #             No lo active todavía.
    #
    # Si alguien se equivoca escribiendo esto, arranca el adaptador manual, que
    # es el que no puede hacer daño.
    adaptador: ${ELPATIO_ERP_ADAPTADOR:manual}

    archivo:
      # Solo la usa el adaptador `archivo`. En Railway tiene que apuntar a un
      # volumen, por lo mismo que las imágenes: el disco del contenedor se borra
      # en cada despliegue, y ahí se irían las ventas sin reportar.
      carpeta: ${ELPATIO_ERP_CARPETA:./datos/erp}

    rest:
      # Vacías mientras no haya integración. El adaptador rest falla en claro si
      # se activa sin URL, en vez de intentar contra una dirección vacía.
      url: ${ELPATIO_ERP_URL:}
      token: ${ELPATIO_ERP_TOKEN:}

  imagenes:
    # Dónde se guardan las fotos de promociones, eventos y galería.
    #
    # EN RAILWAY TIENE QUE APUNTAR A UN VOLUMEN. El sistema de archivos normal
    # del contenedor se borra en cada despliegue: sin volumen, las fotos duran
    # hasta el siguiente despliegue y el sitio queda con los marcos vacíos.
    ruta: ${ELPATIO_RUTA_IMAGENES:./datos/imagenes}

    # Si estas tres están puestas, las fotos van a Cloudinary y no al disco.
    # Vacías en desarrollo: la máquina local no necesita cuenta de nadie.
    #
    # El secreto NO se escribe aquí ni en ningún archivo del repositorio: entra
    # por variable de entorno del servicio, igual que el secreto del JWT.
    cloudinary:
      nombre: ${ELPATIO_CLOUDINARY_NOMBRE:}
      llave: ${ELPATIO_CLOUDINARY_LLAVE:}
      secreto: ${ELPATIO_CLOUDINARY_SECRETO:}

  # Dónde queda el local, para medir qué tan lejos pidió el cliente.
  #
  # Es la puerta del restaurante, tomada de su ficha en Google Maps, y el mismo
  # par que usa el mapa del sitio público en config.ts. Sigue siendo
  # configurable por si el sistema se instala en otra sede.
  local:
    latitud: ${ELPATIO_LATITUD:10.3390034}
    longitud: ${ELPATIO_LONGITUD:-75.4225372}

  jwt:
    # Sin valor por defecto a propósito: si falta, el backend no arranca. Un
    # secreto de ejemplo funcionando en producción es peor que un fallo visible.
    secreto: ${ELPATIO_JWT_SECRETO}
    minutos-acceso: ${ELPATIO_JWT_MINUTOS:20}
    dias-refresco: ${ELPATIO_JWT_DIAS_REFRESCO:30}
  cors:
    # Lista separada por comas. Nunca `*`: el navegador envía el token.
    origenes: ${ELPATIO_CORS_ORIGENES:http://localhost:5173}

  # Los anticipos de los canales automatizados (WhatsApp, y luego teléfono),
  # cobrados con un link de pago de Wompi.
  #
  # La URL base es la que decide sandbox o producción: por defecto apunta al
  # ambiente de pruebas, con llaves de prueba que Wompi entrega sin costo. El
  # secreto de eventos NO es el mismo que el de integridad del widget: es el
  # que Wompi muestra junto a la URL del webhook, y firma cada aviso que manda.
  # Ninguno de los dos se escribe aquí ni en ningún archivo del repositorio.
  wompi:
    url-base: ${ELPATIO_WOMPI_URL_BASE:https://sandbox.wompi.co/v1}
    llave-privada: ${ELPATIO_WOMPI_LLAVE_PRIVADA:}
    secreto-eventos: ${ELPATIO_WOMPI_SECRETO_EVENTOS:}

  # El bot de WhatsApp, contra la Graph API de Meta directa (sin BSP).
  #
  # `verify-token` es el que se escribe en el panel de Meta al configurar la
  # URL del webhook: lo inventa uno mismo, no lo entrega Meta. `app-secret` si
  # lo entrega Meta, en la App creada en developers.facebook.com, y es lo que
  # firma cada evento que manda. Ninguno de los dos se escribe aquí ni en
  # ningún archivo del repositorio.
  whatsapp:
    url-base: ${ELPATIO_WHATSAPP_URL_BASE:https://graph.facebook.com/v21.0}
    phone-number-id: ${ELPATIO_WHATSAPP_PHONE_NUMBER_ID:}
    token-acceso: ${ELPATIO_WHATSAPP_TOKEN_ACCESO:}
    verify-token: ${ELPATIO_WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${ELPATIO_WHATSAPP_APP_SECRET:}

  # El interprete de pedidos en texto libre (WhatsApp, fase 4).
  #
  # Solo se le pasa el menu real (id y nombre, nunca precios): el backend es
  # quien busca el precio y arma el total con lo que el interprete devuelve.
  # El modelo es configuracion: se puede bajar a uno mas barato sin tocar
  # codigo si el volumen de mensajes lo justifica.
  ia:
    llave: ${ELPATIO_ANTHROPIC_LLAVE:}
    modelo: ${ELPATIO_ANTHROPIC_MODELO:claude-opus-5}

  # Cuentas de demostración con clave conocida, para enseñar el sistema.
  #
  # Vacío es lo correcto en producción: sin esto el modo no existe. Con esto
  # puesto, las seis cuentas quedan con esta misma clave en cada arranque y la
  # pantalla de acceso las muestra escritas. Ver ModoDemostracion.java.
  demostracion:
    clave: ${ELPATIO_CLAVE_DEMO:}

logging:
  level:
    root: ${LOG_NIVEL:INFO}
    co.elpatio: ${LOG_NIVEL_APP:INFO}
