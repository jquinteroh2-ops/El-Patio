<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="El Patio">
  <!--
    PROVISIONAL: es el mismo símbolo de src/publico/Marca.tsx, no el logo real
    del restaurante. Cuando llegue el archivo vectorial, se reemplazan los dos.

    Los colores salen de tailwind.config.js: onix-950 de fondo y oro-400 para la
    marca. Antes esto usaba verde #0C2317 y naranja #DC8B33, de una paleta que
    el sitio ya no usa: el icono de la pestaña no coincidía con la página que
    abría.
  -->
  <rect width="64" height="64" rx="14" fill="#0A0908"/>
  <path d="M32 9c2.8 9.2 8.2 15.2 16.8 18.6C40.2 31 34.8 37 32 46.2 29.2 37 23.8 31 15.2 27.6 23.8 24.2 29.2 18.2 32 9Z" fill="#D4B255"/>
  <text x="32" y="59" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="11" font-weight="600" letter-spacing="2.5" fill="#F5EEE1">EL PATIO</text>
</svg>
